<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>秘密の言語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div id="app">
    <header id="app-header" class="app-header">
      <button id="back-btn" class="icon-btn" hidden aria-label="戻る">←</button>
      <h1 id="header-title">秘密の言語</h1>
      <button id="header-action" class="icon-btn" hidden aria-label="操作"></button>
    </header>

    <main id="view-root" class="view-root"></main>

    <button id="fab-add" class="fab" aria-label="作る">＋</button>

    <nav id="bottom-nav" class="bottom-nav" hidden>
      <button class="nav-btn" data-tab="home">ホーム</button>
      <button class="nav-btn" data-tab="dictionary">辞書</button>
      <button class="nav-btn" data-tab="rules">ルール</button>
      <button class="nav-btn" data-tab="chat">チャット</button>
    </nav>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-content" class="modal-content"></div>
  </div>

  <div id="boot-loading" class="boot-loading">
    <p>読み込み中…</p>
  </div>

  <script src="js/store.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
