name: Keep Supabase Alive

# Supabase無料プランは1週間アクセスがないとプロジェクトが自動停止するため、
# 2日おきに軽いリクエストを送って「使われている」状態を保つ。
on:
  schedule:
    - cron: '0 4 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabaseに軽いリクエストを送る
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_YUGStemKko-92RCcH0uOFg_Yn2VeBQe" \
            -H "Authorization: Bearer sb_publishable_YUGStemKko-92RCcH0uOFg_Yn2VeBQe" \
            "https://xyhhzxpvrbytbubxqaxo.supabase.co/rest/v1/languages?select=id&limit=1")
          echo "response status: $code"
          if [ "$code" != "200" ]; then
            echo "予期しないステータスコードです" >&2
            exit 1
          fi
